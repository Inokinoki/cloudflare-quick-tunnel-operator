name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/inokinoki/cloudflare-quick-tunnel-operator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Stamp chart version from the tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VER}/" charts/cloudflare-quick-tunnel-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VER}\"/" charts/cloudflare-quick-tunnel-operator/Chart.yaml
      - name: Package
        run: helm package charts/cloudflare-quick-tunnel-operator
      - name: Push to GHCR (OCI)
        env:
          HELM_REGISTRY: ghcr.io
          HELM_USER: ${{ github.actor }}
          HELM_PASS: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$HELM_PASS" | helm registry login "$HELM_REGISTRY" -u "$HELM_USER" --password-stdin
          helm push cloudflare-quick-tunnel-operator-*.tgz "oci://$HELM_REGISTRY/inokinoki/charts"

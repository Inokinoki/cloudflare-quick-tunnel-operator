# Expose a single Service through a hostless Ingress: the Ingress-mode
# equivalent of the quicktunnel.dev/expose Service annotation.
# Read the URL from `kubectl get ingress` (ADDRESS column), from
# status.loadBalancer, or from the bare quicktunnel.dev/url annotation.
# Do NOT combine this with quicktunnel.dev/expose on the same Service —
# you would get two independent tunnels.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-nginx
spec:
  ingressClassName: quicktunnel
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-nginx
                port: { number: 80 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-nginx
  template:
    metadata:
      labels:
        app: demo-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-nginx
spec:
  selector:
    app: demo-nginx
  ports:
    - port: 80
      targetPort: 80

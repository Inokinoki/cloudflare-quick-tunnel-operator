# Demo: a plain nginx exposed to the public internet with zero configuration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-nginx
  template:
    metadata:
      labels:
        app: demo-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-nginx
  annotations:
    quicktunnel.dev/expose: "true"
spec:
  selector:
    app: demo-nginx
  ports:
    - port: 80
      targetPort: 80

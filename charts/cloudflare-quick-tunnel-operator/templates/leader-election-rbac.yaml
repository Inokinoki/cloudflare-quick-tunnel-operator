{{- if .Values.rbac.create }}
# Leader election lease; scoped to the release namespace where the operator
# pod runs (controller-runtime creates the lease next to the pod).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cjqto.fullname" . }}-leader-election
  labels:
    {{- include "cjqto.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cjqto.fullname" . }}-leader-election
  labels:
    {{- include "cjqto.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cjqto.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "cjqto.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
